# /etc/nginx/sites-available/admin.mangro.cloud 로 복사해서 쓴다.
# certbot --nginx -d admin.mangro.cloud 가 443 블록과 리다이렉트를 자동으로 붙인다.
server {
    listen 80;
    server_name admin.mangro.cloud;

    root /var/www/admin;
    index index.html;

    # SPA 라 서버에 실제 파일이 없는 경로(/recipes/12 등)도 index.html 로 넘겨야 한다.
    # 이게 없으면 새로고침할 때마다 404 가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite 가 해시 붙인 파일명을 쓰므로 내용이 바뀌면 이름도 바뀐다 — 영구 캐시가 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 반대로 index.html 은 캐시하면 새 배포가 반영되지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
